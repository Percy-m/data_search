<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <style>
      text { font-family: "STHeiti", "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .section { font-size: 22px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 600; }
      .small { font-size: 14px; fill: #64748b; }
      .mono { font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size: 14px; fill: #d1e7ff; }
      .card { fill: #fff; stroke: #dbe3ed; stroke-width: 1.2; rx: 18; filter: url(#shadow); }
      .field { fill: #f8fafc; stroke: #dbe3ed; stroke-width: 1; rx: 10; }
      .button { fill: #2563eb; rx: 10; }
      .ok { fill: #dcfce7; stroke: #86efac; }
      .warn { fill: #fff7ed; stroke: #fdba74; }
    </style>
  </defs>
  <rect width="1440" height="900" fill="#f3f6fa"/>
  <rect x="48" y="36" width="1344" height="82" rx="18" fill="#172033"/>
  <text x="84" y="88" fill="#fff" class="title">自定义 Python 脚本视图设计</text>
  <text x="500" y="86" fill="#b9c5d4" font-size="16">本地脚本上传到平台执行，输出 PNG 后作为 Dashboard Widget 展示</text>

  <rect x="64" y="154" width="410" height="660" class="card"/>
  <text x="98" y="204" class="section">脚本配置</text>
  <text x="98" y="248" class="label">脚本名称</text>
  <rect x="98" y="264" width="320" height="42" class="field"/>
  <text x="118" y="291" class="small">pipeline_revenue_trend.py</text>
  <text x="98" y="338" class="label">入口命令</text>
  <rect x="98" y="354" width="320" height="42" class="field"/>
  <text x="118" y="381" class="small">python main.py --date {{date}}</text>
  <text x="98" y="428" class="label">输出约定</text>
  <rect x="98" y="444" width="320" height="100" class="field"/>
  <text x="118" y="474" class="small">主图：$OUTPUT_DIR/main.png</text>
  <text x="118" y="504" class="small">元数据：$OUTPUT_DIR/result.json</text>
  <text x="118" y="534" class="small">日志：stdout / stderr 自动采集</text>
  <text x="98" y="588" class="label">运行参数</text>
  <rect x="98" y="604" width="150" height="38" class="field"/>
  <text x="116" y="629" class="small">date</text>
  <rect x="268" y="604" width="150" height="38" class="field"/>
  <text x="286" y="629" class="small">2026-05-14</text>
  <rect x="98" y="684" width="132" height="44" class="button"/>
  <text x="128" y="712" fill="#fff" font-size="16" font-weight="700">上传脚本</text>
  <rect x="250" y="684" width="132" height="44" fill="#16a34a" rx="10"/>
  <text x="280" y="712" fill="#fff" font-size="16" font-weight="700">立即运行</text>

  <rect x="514" y="154" width="410" height="660" class="card"/>
  <text x="548" y="204" class="section">统一 Python 执行环境</text>
  <rect x="548" y="238" width="330" height="176" rx="14" fill="#0f172a"/>
  <text x="572" y="272" class="mono">$ python main.py --date 2026-05-14</text>
  <text x="572" y="306" class="mono">loading pipeline result...</text>
  <text x="572" y="340" class="mono">plot saved: /output/main.png</text>
  <text x="572" y="374" class="mono">status: success, elapsed: 8.2s</text>
  <rect x="548" y="454" width="330" height="78" class="ok" rx="14"/>
  <text x="574" y="486" class="label">运行成功</text>
  <text x="574" y="514" class="small">产物校验通过，主图大小 1.2 MB</text>
  <rect x="548" y="564" width="330" height="100" class="warn" rx="14"/>
  <text x="574" y="596" class="label">受控约束</text>
  <text x="574" y="624" class="small">超时、输出目录、文件大小、日志保留</text>
  <text x="574" y="650" class="small">禁止修改平台源码和元数据库</text>

  <rect x="964" y="154" width="410" height="660" class="card"/>
  <text x="998" y="204" class="section">Dashboard 中查看</text>
  <rect x="998" y="244" width="330" height="400" rx="16" fill="#f8fafc" stroke="#dbe3ed"/>
  <rect x="1022" y="270" width="282" height="42" rx="10" fill="#fff" stroke="#dbe3ed"/>
  <text x="1044" y="297" class="label">流水线收入趋势脚本视图</text>
  <rect x="1022" y="342" width="282" height="228" rx="12" fill="#fff" stroke="#dbe3ed"/>
  <line x1="1050" y1="528" x2="1270" y2="528" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="1050" y1="370" x2="1050" y2="528" stroke="#cbd5e1" stroke-width="2"/>
  <polyline points="1060,500 1095,480 1130,486 1165,438 1200,416 1235,390 1270,370" fill="none" stroke="#2563eb" stroke-width="5"/>
  <circle cx="1270" cy="370" r="8" fill="#2563eb"/>
  <text x="1022" y="604" class="small">最近运行：2026-05-14 10:32</text>
  <rect x="1022" y="668" width="120" height="42" rx="10" fill="#2563eb"/>
  <text x="1050" y="695" fill="#fff" font-size="15" font-weight="700">刷新运行</text>
  <rect x="1160" y="668" width="120" height="42" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="1187" y="695" fill="#2563eb" font-size="15" font-weight="700">查看日志</text>
</svg>
