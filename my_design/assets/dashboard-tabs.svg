<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172033" flood-opacity="0.14"/>
    </filter>
    <style>
      text { font-family: "STHeiti", "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #182235; }
      .small { font-size: 14px; fill: #64748b; }
      .label { font-size: 16px; font-weight: 600; }
      .title { font-size: 26px; font-weight: 700; }
      .shell { fill: #f3f6fa; }
      .panel { fill: #fff; stroke: #dbe3ed; stroke-width: 1; filter: url(#shadow); }
      .card { fill: #fff; stroke: #dbe3ed; stroke-width: 1.2; rx: 12; }
      .primary { fill: #2563eb; }
      .tab { fill: #f8fafc; stroke: #dbe3ed; rx: 10; }
      .tab-active { fill: #2563eb; stroke: #2563eb; rx: 10; }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1440" height="900" class="shell"/>
  <rect x="36" y="32" width="1368" height="84" rx="18" fill="#172033"/>
