<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "STHeiti", "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .section { font-size: 22px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 600; }
      .small { font-size: 14px; fill: #64748b; }
      .card { fill: #fff; stroke: #dbe3ed; stroke-width: 1.2; rx: 18; filter: url(#shadow); }
      .box { fill: #f8fafc; stroke: #dbe3ed; stroke-width: 1.2; rx: 14; }
      .line { stroke: #64748b; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .blue { fill: #e9f2ff; stroke: #7cb4ff; }
      .green { fill: #e8f7ef; stroke: #6fd39a; }
      .amber { fill: #fff4df; stroke: #f2bd5b; }
      .red { fill: #fff0f1; stroke: #ef8b92; }
    </style>
  </defs>
  <rect width="1440" height="900" fill="#f3f6fa"/>
  <rect x="48" y="36" width="1344" height="82" rx="18" fill="#172033"/>
  <text x="84" y="88" fill="#fff" class="title">数据对比流程与页面设计</text>
  <text x="470" y="86" fill="#b9c5d4" font-size="16">同一 SQL 在 baseline / target 两组宏变量下运行，对齐、汇总、明细钻取</text>

  <rect x="64" y="154" width="1312" height="220" class="card"/>
  <text x="96" y="204" class="section">执行链路</text>
  <rect x="112" y="238" width="188" height="78" class="box blue"/>
  <text x="146" y="270" class="label">输入 SQL</text>
  <text x="132" y="296" class="small">配置宏变量和主键</text>
  <rect x="364" y="238" width="188" height="78" class="box green"/>
  <text x="394" y="270" class="label">Baseline 查询</text>
  <text x="388" y="296" class="small">宏：version=A</text>
  <rect x="616" y="238" width="188" height="78" class="box green"/>
  <text x="656" y="270" class="label">Target 查询</text>
  <text x="648" y="296" class="small">宏：version=B</text>
  <rect x="868" y="238" width="188" height="78" class="box amber"/>
  <text x="906" y="270" class="label">主键对齐</text>
  <text x="900" y="296" class="small">重复 key 拒绝</text>
  <rect x="1120" y="238" width="188" height="78" class="box red"/>
  <text x="1156" y="270" class="label">汇总与明细</text>
  <text x="1142" y="296" class="small">一致、不一致、缺失</text>
  <path d="M300 277 H364" class="line"/>
  <path d="M552 277 H616" class="line"/>
  <path d="M804 277 H868" class="line"/>
  <path d="M1056 277 H1120" class="line"/>

  <rect x="64" y="414" width="620" height="386" class="card"/>
  <text x="96" y="464" class="section">汇总表展示</text>
  <rect x="96" y="500" width="540" height="44" fill="#eef2f7" rx="8"/>
  <text x="116" y="528" class="label">业务名目/分组</text>
  <text x="270" y="528" class="label">对比标准</text>
  <text x="390" y="528" class="label">一致数</text>
  <text x="486" y="528" class="label">不一致数</text>
  <text x="586" y="528" class="label">一致率</text>
  <line x1="96" y1="574" x2="636" y2="574" stroke="#e2e8f0"/>
  <text x="116" y="606" class="small">华东</text>
  <text x="270" y="606" class="small">金额一致性</text>
  <text x="410" y="606" fill="#16a34a" font-size="15" font-weight="700">1280</text>
  <text x="512" y="606" fill="#dc2626" font-size="15" font-weight="700">12</text>
  <text x="586" y="606" class="small">99.07%</text>
  <line x1="96" y1="634" x2="636" y2="634" stroke="#e2e8f0"/>
  <text x="116" y="666" class="small">华南</text>
  <text x="270" y="666" class="small">状态一致性</text>
  <text x="410" y="666" fill="#16a34a" font-size="15" font-weight="700">916</text>
  <text x="512" y="666" fill="#dc2626" font-size="15" font-weight="700">21</text>
  <text x="586" y="666" class="small">97.76%</text>
  <rect x="430" y="720" width="206" height="40" rx="10" fill="#f8fafc" stroke="#dbe3ed"/>
  <text x="454" y="746" class="small">共 128 行  1 / 3 页</text>

  <rect x="724" y="414" width="652" height="386" class="card"/>
  <text x="756" y="464" class="section">点击计数打开明细</text>
  <rect x="756" y="500" width="568" height="44" fill="#eef2f7" rx="8"/>
  <text x="776" y="528" class="label">key.order_id</text>
  <text x="920" y="528" class="label">Baseline 值</text>
  <text x="1062" y="528" class="label">Target 值</text>
  <text x="1210" y="528" class="label">状态</text>
  <line x1="756" y1="574" x2="1324" y2="574" stroke="#e2e8f0"/>
  <text x="776" y="606" class="small">O-10086</text>
  <text x="920" y="606" class="small">1200.00</text>
  <text x="1062" y="606" class="small">1218.00</text>
  <text x="1210" y="606" fill="#dc2626" font-size="15" font-weight="700">不一致</text>
  <line x1="756" y1="634" x2="1324" y2="634" stroke="#e2e8f0"/>
  <text x="776" y="666" class="small">O-10091</text>
  <text x="920" y="666" class="small">NULL</text>
  <text x="1062" y="666" class="small">active</text>
  <text x="1210" y="666" fill="#d97706" font-size="15" font-weight="700">Baseline 缺失</text>
  <rect x="1130" y="720" width="194" height="40" rx="10" fill="#f8fafc" stroke="#dbe3ed"/>
  <text x="1154" y="746" class="small">明细分页接口加载</text>
</svg>
