<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8fb"/>
      <stop offset="1" stop-color="#eef3f8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <style>
      text { font-family: "STHeiti", "PingFang SC", "Helvetica Neue", Arial, sans-serif; fill: #172033; }
      .muted { fill: #64748b; font-size: 18px; }
      .title { font-size: 34px; font-weight: 700; }
      .section { font-size: 24px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 600; }
      .small { font-size: 15px; fill: #64748b; }
      .card { fill: #fff; stroke: #d7dee8; stroke-width: 1.5; rx: 18; filter: url(#shadow); }
      .module { fill: #f8fafc; stroke: #d7dee8; stroke-width: 1.4; rx: 14; }
      .blue { fill: #e9f2ff; stroke: #7cb4ff; }
      .green { fill: #e8f7ef; stroke: #6fd39a; }
      .amber { fill: #fff4df; stroke: #f2bd5b; }
      .purple { fill: #f0ecff; stroke: #a99af6; }
      .red { fill: #fff0f1; stroke: #ef8b92; }
      .line { stroke: #9aa8bc; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#9aa8bc"/>
    </marker>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <text x="64" y="74" class="title">统一数据分析控制台设计总览</text>
  <text x="64" y="110" class="muted">多数据源查询、拖拽看板、智能下钻、数据对比、自定义 Python 脚本视图</text>

  <rect x="60" y="150" width="380" height="650" class="card"/>
  <text x="92" y="200" class="section">用户工作区</text>
  <rect x="92" y="235" width="292" height="72" class="module blue"/>
  <text x="120" y="265" class="label">配置中心</text>
  <text x="120" y="292" class="small">ClickHouse / DuckDB 数据源接入</text>
  <rect x="92" y="329" width="292" height="72" class="module green"/>
  <text x="120" y="359" class="label">分析工作台</text>
  <text x="120" y="386" class="small">SQL 调试、宏变量、图表预览</text>
  <rect x="92" y="423" width="292" height="72" class="module amber"/>
  <text x="120" y="453" class="label">Dashboard 看板</text>
  <text x="120" y="480" class="small">多页签、拖拽布局、阈值高亮</text>
  <rect x="92" y="517" width="292" height="72" class="module purple"/>
  <text x="120" y="547" class="label">数据对比</text>
  <text x="120" y="574" class="small">Baseline / Target 主键对齐</text>
  <rect x="92" y="611" width="292" height="72" class="module red"/>
  <text x="120" y="641" class="label">自定义 Python 视图</text>
  <text x="120" y="668" class="small">上传脚本、运行、展示 PNG 产物</text>

  <rect x="530" y="150" width="420" height="650" class="card"/>
  <text x="562" y="200" class="section">后端业务能力</text>
  <rect x="570" y="238" width="320" height="92" class="module blue"/>
  <text x="602" y="272" class="label">FastAPI API Layer</text>
  <text x="602" y="300" class="small">data / dashboards / comparisons / sources</text>
  <rect x="570" y="370" width="320" height="92" class="module green"/>
  <text x="602" y="404" class="label">QueryService</text>
  <text x="602" y="432" class="small">宏变量预编译、缓存、原生 SQL 查询</text>
  <rect x="570" y="502" width="320" height="92" class="module purple"/>
  <text x="602" y="536" class="label">ComparisonService</text>
  <text x="602" y="564" class="small">主键对齐、分组汇总、明细分页</text>
  <rect x="570" y="634" width="320" height="92" class="module amber"/>
  <text x="602" y="668" class="label">Script Runtime 设计</text>
  <text x="602" y="696" class="small">统一 Python 环境、运行记录、PNG 产物</text>

  <rect x="1040" y="150" width="320" height="650" class="card"/>
  <text x="1072" y="200" class="section">数据与元数据</text>
  <rect x="1080" y="250" width="230" height="90" class="module blue"/>
  <text x="1110" y="285" class="label">PostgreSQL</text>
  <text x="1110" y="313" class="small">data_sources / saved_queries</text>
  <rect x="1080" y="382" width="230" height="90" class="module amber"/>
  <text x="1110" y="417" class="label">Dashboard Meta</text>
  <text x="1110" y="445" class="small">dashboards / tabs / widgets</text>
  <rect x="1080" y="514" width="230" height="90" class="module purple"/>
  <text x="1110" y="549" class="label">Comparison Meta</text>
  <text x="1110" y="577" class="small">comparison_configs</text>
  <rect x="1080" y="646" width="230" height="90" class="module green"/>
  <text x="1110" y="681" class="label">业务数据源</text>
  <text x="1110" y="709" class="small">ClickHouse / DuckDB</text>

  <path d="M440 470 C485 470 485 284 570 284" class="line"/>
  <path d="M890 284 C970 284 970 296 1080 296" class="line"/>
  <path d="M890 416 C980 416 980 690 1080 690" class="line"/>
  <path d="M890 548 C980 548 980 558 1080 558" class="line"/>
  <path d="M890 680 C980 680 980 427 1080 427" class="line"/>

  <rect x="60" y="830" width="1300" height="42" rx="12" fill="#172033"/>
  <text x="92" y="858" fill="#fff" font-size="17">设计重点：让分析师把 SQL、Dashboard 编排、对比任务和本地 Python 指标脚本统一沉淀为可复用的业务视图。</text>
</svg>
